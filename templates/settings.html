<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - 卡密管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <div class="header-left">
                <div class="logo-small">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                        <line x1="1" y1="10" x2="23" y2="10"/>
                    </svg>
                </div>
                <h1>卡密管理系统</h1>
            </div>
            <div class="header-right">
                <nav class="nav">
                    <a class="nav-link" href="{{ url_for('dashboard') }}">仪表盘</a>
                    <a class="nav-link active" href="{{ url_for('settings') }}">设置</a>
                </nav>
                <a href="{{ url_for('logout') }}" class="btn-logout">退出登录</a>
            </div>
        </header>

        <main class="main-content">
            <section class="settings-hero">
                <div>
                    <h2>设置</h2>
                    <p>导入卡密与系统管理入口</p>
                </div>
            </section>

            <section class="settings-grid">
                <div class="import-panel">
                    <h2>导入卡密</h2>
                    <p class="panel-desc">每行一个卡密，支持批量导入。</p>
                    <div class="field">
                        <label for="provider-select">选择卡商</label>
                        {% if providers %}
                        <select id="provider-select" class="select-control">
                            {% for p in providers %}
                            <option value="{{ p.id }}">{{ p.name }}</option>
                            {% endfor %}
                        </select>
                        {% else %}
                        <div class="empty-hint">暂无卡商</div>
                        {% endif %}
                    </div>
                    <textarea id="keys-input" placeholder="每行一个卡密..."></textarea>
                    <button id="btn-import" class="btn-primary" {% if not providers %}disabled{% endif %}>导入卡密</button>
                </div>

                <div class="settings-panel">
                    <h2>导入说明</h2>
                    <ul class="settings-list">
                        <li>支持直接粘贴多行内容</li>
                        <li>导入前会尝试校验卡密有效性</li>
                        <li>校验异常的卡密会按未校验导入</li>
                        <li>重复的卡密会自动忽略</li>
                        <li>导入后可在仪表盘一键激活</li>
                    </ul>
                </div>
            </section>
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
