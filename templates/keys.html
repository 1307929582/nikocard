<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡密管理 - 卡密管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <div class="header-left">
                <div class="logo-small">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                        <line x1="1" y1="10" x2="23" y2="10"/>
                    </svg>
                </div>
                <h1>卡密管理系统</h1>
            </div>
            <div class="header-right">
                <nav class="nav">
                    <a class="nav-link" href="{{ url_for('dashboard') }}">仪表盘</a>
                    <a class="nav-link active" href="{{ url_for('keys') }}">卡密管理</a>
                    <a class="nav-link" href="{{ url_for('settings') }}">设置</a>
                </nav>
                <a href="{{ url_for('logout') }}" class="btn-logout">退出登录</a>
            </div>
        </header>

        <main class="main-content">
            <section class="keys-hero">
                <div>
                    <h2>卡密管理</h2>
                    <p>筛选、搜索与批量删除卡密</p>
                </div>
                <div class="keys-summary" id="keys-summary">加载中...</div>
            </section>

            <section class="keys-toolbar panel-surface">
                <div class="field">
                    <label for="keys-provider">卡商</label>
                    <select id="keys-provider" class="select-control">
                        <option value="">全部</option>
                        {% for p in providers %}
                        <option value="{{ p.id }}">{{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field">
                    <label for="keys-status">状态</label>
                    <select id="keys-status" class="select-control">
                        <option value="all">全部</option>
                        <option value="unused">未使用</option>
                        <option value="used">已使用</option>
                        <option value="failed">失败</option>
                    </select>
                </div>
                <div class="field">
                    <label for="keys-search">搜索卡密</label>
                    <input id="keys-search" type="text" placeholder="输入卡密关键字">
                </div>
                <div class="keys-actions">
                    <button id="keys-refresh" class="btn-secondary" type="button">刷新</button>
                    <button id="keys-delete" class="btn-danger" type="button" disabled>删除所选</button>
                </div>
            </section>

            <section class="keys-table-section">
                <table class="keys-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="keys-select-all"></th>
                            <th>卡密</th>
                            <th>卡商</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>使用时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="keys-body">
                        <tr><td colspan="7" class="keys-empty">暂无数据</td></tr>
                    </tbody>
                </table>
            </section>

            <section class="keys-pagination">
                <button id="keys-prev" class="btn-secondary" type="button">上一页</button>
                <span id="keys-page">1 / 1</span>
                <button id="keys-next" class="btn-secondary" type="button">下一页</button>
            </section>
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
